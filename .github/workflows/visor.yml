name: Visor

on:
  workflow_call:
    secrets:
      PROBE_APP_ID:
        required: true
      PROBE_APP_PRIVATE_KEY:
        required: true
      PROBE_APP_INSTALLATION_ID:
        required: true
      GOOGLE_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  visor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: probelabs/visor@main
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          installation-id: ${{ secrets.PROBE_APP_INSTALLATION_ID }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_URL: ${{ secrets.GOOGLE_API_URL }}